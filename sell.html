<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงประกาศขาย | Student Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav aria-label="เมนูหลัก">
      <a href="index.html"><strong>Student Market</strong></a>
      <a href="products.html">สินค้าทั้งหมด</a>
      <a href="sell.html">ลงประกาศขาย</a>
      <a href="mylistings.html">รายการของฉัน</a>
    </nav>
  </header>
  <main>
    <h1>ลงประกาศขายสินค้า</h1>
    <div class="sell-container">
      <section class="form-section">
        <h2>กรอกข้อมูลสินค้า</h2>
        <form id="sell-form" novalidate>
          <p>
            <label for="title">ชื่อสินค้า</label>
            <input type="text" id="title" name="title" required minlength="3" maxlength="80" placeholder="เช่น หนังสือ Calculus 1">
          </p>
          <p>
            <label for="category">หมวดหมู่</label>
            <select id="category" name="category" required>
              <option value="">เลือกหมวดหมู่</option>
              <option value="อุปกรณ์การเรียน">อุปกรณ์การเรียน</option>
              <option value="ชุดนักศึกษา">ชุดนักศึกษา</option>
              <option value="ของใช้ส่วนตัว">ของใช้ส่วนตัว</option>
              <option value="ของใช้ในหอ">ของใช้ในหอ</option>
            </select>
          </p>
          <p>
            <label for="price">ราคา (บาท)</label>
            <input type="number" id="price" name="price" min="0" step="1" required placeholder="0">
          </p>
          <fieldset>
            <legend>สภาพสินค้า</legend>
            <label><input type="radio" name="condition" value="ใหม่" required> ใหม่</label>
            <label><input type="radio" name="condition" value="ดี"> ดี</label>
            <label><input type="radio" name="condition" value="พอใช้"> พอใช้</label>
          </fieldset>
          <p>
            <label for="image-file">รูปภาพสินค้า</label>
            <input type="file" id="image-file" accept="image/*">
          </p>
          <p>
            <label for="description">รายละเอียด (ไม่เกิน 300 ตัวอักษร)</label>
            <textarea id="description" name="description" rows="4" maxlength="300" required placeholder="อธิบายรายละเอียด สภาพสินค้าเพิ่มเติม..."></textarea>
          </p>
          <p>
            <label for="meetPoint">จุดนัดรับ</label>
            <select id="meetPoint" name="meetPoint" required>
              <option value="">เลือกจุดนัดรับ</option>
              <option value="หน้าหอสมุด">หน้าหอสมุด</option>
              <option value="โรงอาหารกลาง">โรงอาหารกลาง</option>
              <option value="หน้าอาคารเรียนรวม">หน้าอาคารเรียนรวม</option>
              <option value="ลานน้ำพุกลางมหาวิทยาลัย">ลานน้ำพุกลางมหาวิทยาลัย</option>
              <option value="หน้าหอพักนักศึกษา">หน้าหอพักนักศึกษา</option>
              <option value="ศูนย์กีฬา">ศูนย์กีฬา</option>
              <option value="ป้ายรถรางหน้ามหาวิทยาลัย">ป้ายรถรางหน้ามหาวิทยาลัย</option>
            </select>
          </p>
          <p>
            <label for="contact">ช่องทางติดต่อ</label>
            <input type="text" id="contact" name="contact" required minlength="3" maxlength="60" placeholder="เช่น LINE: demo_seller01">
          </p>
          <p id="error-message" role="alert" class="error-msg"></p>
          <button type="submit" class="btn-main">ยืนยันลงประกาศ</button>
        </form>
      </section>

      <section class="preview-section">
        <h2>ตัวอย่างการ์ดประกาศ (Real-time)</h2>
        <div id="preview-card" class="product-grid">
          <!-- Real-time Card Preview Rendered by JS -->
        </div>
      </section>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 Student Market</p>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
