<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงประกาศขาย - Student Market</title>
  <link rel="stylesheet" href="css/style-theme1.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Student Market</a>
      <nav>
        <a href="products.html">สินค้าทั้งหมด</a>
        <a href="sell.html" class="active">ลงประกาศขาย</a>
        <a href="mylistings.html">รายการของฉัน</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div class="sell-page-grid">
      <!-- ฟอร์มลงประกาศ -->
      <section class="content-card">
        <h1>ลงประกาศขายสินค้า</h1>
        <form id="sell-form" novalidate>
          <div class="form-group">
            <label for="title">ชื่อสินค้า <span class="req">*</span></label>
            <input type="text" id="title" required placeholder="เช่น หนังสือ Calculus 1">
            <span class="error-msg" id="err-title"></span>
          </div>

          <div class="form-group">
            <label for="category">หมวดหมู่ <span class="req">*</span></label>
            <select id="category" required>
              <option value="">-- เลือกหมวดหมู่ --</option>
              <option value="ของใช้ในหอ">ของใช้ในหอ</option>
              <option value="ของใช้ส่วนตัว">ของใช้ส่วนตัว</option>
              <option value="หนังสือเรียน">หนังสือเรียน</option>
              <option value="อุปกรณ์การเรียน">อุปกรณ์การเรียน</option>
            </select>
            <span class="error-msg" id="err-category"></span>
          </div>

          <div class="form-group">
            <label for="price">ราคา (บาท) <span class="req">*</span></label>
            <input type="number" id="price" min="0" required placeholder="เช่น 250">
            <span class="error-msg" id="err-price"></span>
          </div>

          <div class="form-group">
            <label>สภาพสินค้า <span class="req">*</span></label>
            <div class="radio-group">
              <label><input type="radio" name="condition" value="ใหม่" required> ใหม่</label>
              <label><input type="radio" name="condition" value="ดี"> ดี</label>
              <label><input type="radio" name="condition" value="พอใช้"> พอใช้</label>
            </div>
            <span class="error-msg" id="err-condition"></span>
          </div>

          <div class="form-group">
            <label for="meetPoint">จุดนัดรับในมหาวิทยาลัย <span class="req">*</span></label>
            <select id="meetPoint" required>
              <option value="">-- เลือกสถานที่นัดรับ --</option>
              <option value="หน้าหอสมุด">หน้าหอสมุด</option>
              <option value="โรงอาหารนอกเมือง (ตึก 22 ชั้น 1)">โรงอาหารนอกเมือง (ตึก 22 ชั้น 1)</option>
              <option value="ประตูหน้ามหาลัย">ประตูหน้ามหาลัย</option>
              <option value="หน้าร้านชงโคพาร์ค">หน้าร้านชงโคพาร์ค</option>
              <option value="สนามฟุตบอลกลาง">สนามฟุตบอลกลาง</option>
              <option value="ตึกเรียนรวม 1">ตึกเรียนรวม 1</option>
            </select>
            <span class="error-msg" id="err-meetPoint"></span>
          </div>

          <div class="form-group">
            <label for="contact">ช่องทางติดต่อ <span class="req">*</span></label>
            <input type="text" id="contact" required placeholder="เช่น LINE: student_01">
            <span class="error-msg" id="err-contact"></span>
          </div>

          <div class="form-group">
            <label for="image-file">รูปภาพสินค้า (อัปโหลดหรือใช้รูปตัวอย่าง) <span class="req">*</span></label>
            <input type="file" id="image-file" accept="image/*">
            <span class="error-msg" id="err-image"></span>
          </div>

          <div class="form-group">
            <label for="description">รายละเอียดสินค้า (ไม่เกิน 200 อักษร)</label>
            <textarea id="description" maxlength="200" rows="4" placeholder="ระบุรายละเอียด เช่น มีรอยขีดข่วนเล็กน้อย..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary">ยืนยันลงประกาศ</button>
        </form>
      </section>

      <!-- Real-time Preview Card (F4) -->
      <section class="content-card">
        <h2>ตัวอย่างการ์ดประกาศ (Preview)</h2>
        <div class="card-preview-wrapper">
          <div class="product-card" id="card-preview">
            <div class="card-img-box">
              <img id="prev-img" src="https://via.placeholder.com/300x200?text=No+Image" alt="ตัวอย่างสินค้า">
              <span class="card-tag" id="prev-category">หมวดหมู่</span>
            </div>
            <div class="card-body">
              <h3 class="card-title" id="prev-title">ชื่อสินค้าจะแสดงที่นี่</h3>
              <div class="card-price-row">
                <span class="card-price" id="prev-price">0 บาท</span>
                <span class="card-condition" id="prev-condition">สภาพ -</span>
              </div>
              <p class="card-location" id="prev-location">📍 จุดนัดรับ...</p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Student Market - Smart Campus Project</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
