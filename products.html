<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>...</title>
  <!-- โหลดฟอนต์ Anuphan และไฟล์ CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav aria-label="เมนูหลัก">
      <a href="index.html"><strong>Student Market</strong></a>
      <a href="products.html">สินค้าทั้งหมด</a>
      <a href="sell.html">ลงประกาศขาย</a>
      <a href="my-listings.html">ตะกร้าของฉัน</a>
      <label>หมวดหมู่
        <select name="category">
          <option value="">ทุกหมวดหมู่</option>
          <option>อุปกรณ์การเรียน</option>
          <option>ชุดนักศึกษา</option>
          <option>ของใช้ส่วนตัว</option>
          <option>ของใช้ในหอ</option>
        </select>
      </label>
    </nav>
  </header>
  <main>
    <h1>สินค้าทั้งหมด</h1>
    
    <section>
      <h2>ค้นหาและกรอง</h2>
      <form>
        <p>
          <label>ค้นหาตามชื่อสินค้า <input type="search" name="q"></label>
        </p>
		   <p>
          <label>สภาพสินค้า
            <select name="condition">
              <option value="">ทุกสภาพ</option>
              <option>ใหม่</option>
              <option>ดี</option>
              <option>พอใช้</option>
            </select>
          </label>
         </p>
        <p>
          <label>ราคาต่ำสุด (บาท) <input type="number" name="min" min="0"></label>
          <label>ราคาสูงสุด (บาท) <input type="number" name="max" min="0"></label>
        </p>
        <p>
          <label>เรียงตาม
            <select name="sort">
              <option value="latest">ล่าสุด</option>
              <option value="low">ราคาต่ำไปสูง</option>
              <option value="high">ราคาสูงไปต่ำ</option>
            </select>
          </label>
        </p>
        <button type="reset">ล้างตัวกรอง</button>
      </form>
    </section>
    
    <section>
      <h2>รายการสินค้า</h2>
      <output></output>
      <div></div>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 Student Market</p>
  </footer>
</body>
</html>
