<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สินค้าทั้งหมด - Student Market</title>
  <link rel="stylesheet" href="css/style-theme1.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Student Market</a>
      <nav>
        <a href="products.html" class="active">สินค้าทั้งหมด</a>
        <a href="sell.html">ลงประกาศขาย</a>
        <a href="mylistings.html">รายการของฉัน</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <section class="content-card">
      <h1>สินค้าทั้งหมดในมหาวิทยาลัย</h1>
      
      <!-- Filter Bar -->
      <div class="filter-box">
        <div class="filter-group">
          <label for="search-input">ค้นหาสินค้า:</label>
          <input type="text" id="search-input" placeholder="พิมพ์ชื่อสินค้า...">
        </div>

        <div class="filter-group">
          <label for="category-filter">หมวดหมู่:</label>
          <select id="category-filter">
            <option value="all">ทุกหมวดหมู่</option>
            <option value="ของใช้ในหอ">ของใช้ในหอ</option>
            <option value="ของใช้ส่วนตัว">ของใช้ส่วนตัว</option>
            <option value="หนังสือเรียน">หนังสือเรียน</option>
            <option value="อุปกรณ์การเรียน">อุปกรณ์การเรียน</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="condition-filter">สภาพสินค้า:</label>
          <select id="condition-filter">
            <option value="all">ทุกสภาพ</option>
            <option value="ใหม่">ใหม่</option>
            <option value="ดี">ดี</option>
            <option value="พอใช้">พอใช้</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="sort-filter">เรียงลำดับ:</label>
          <select id="sort-filter">
            <option value="newest">ล่าสุด</option>
            <option value="price-low">ราคา: ต่ำสุด -> สูงสุด</option>
            <option value="price-high">ราคา: สูงสุด -> ต่ำสุด</option>
          </select>
        </div>
      </div>

      <div id="all-products-grid" class="products-grid">
        <!-- Render ด้วย JS -->
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Student Market - Smart Campus Project</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
