// ===== ตัวช่วยทั่วไป =====
const $ = (id) => document.getElementById(id);
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { alert('บันทึกข้อมูลลงเบราว์เซอร์ไม่ได้ (พื้นที่เต็มหรือรูปใหญ่เกินไป)'); return false; } };
const getMine = () => load('sm-mine', []);
const getWish = () => load('sm-wish', []);
const allItems = () => [...getMine(), ...PRODUCTS].sort((a, b) => new Date(b.postedAt) - new Date(a.postedAt));

const ago = (iso) => {
  const d = new Date(iso);
  const s = Math.floor((Date.now() - d) / 1000);
  if (s < 0) return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
  if (s < 60) return 'เมื่อสักครู่';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' นาทีที่แล้ว';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' ชั่วโมงที่แล้ว';
  return Math.floor(h / 24) + ' วันที่แล้ว';
};
const baht = (n) => Number(n).toLocaleString('th-TH') + ' บาท';
const avgOf = (cat) => { const l = allItems().filter(p => p.category === cat); return l.reduce((s, p) => s + p.price, 0) / l.length; };
const el = (tag, text, attrs) => {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v));
  return e;
};
const para = (...nodes) => { const p = el('p'); p.append(...nodes); return p; };
const badges = (p) => p.sold ? 'ขายแล้ว' : (p.price > 0 && p.price < avgOf(p.category) ? 'ราคาดี' : '');

// ===== รูปภาพ: ใช้ path จากฟิลด์ image ถ้าไฟล์หาย/ไม่มีรูป จะแสดงกรอบว่างขนาดเดิม =====
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const photo = (p, w, h) => {
  const i = el('img', undefined, { src: p.image || BLANK, width: w || 320, height: h || 240, alt: 'รูปสินค้า: ' + p.title });
  i.addEventListener('error', () => { i.src = BLANK; }, { once: true });
  return i;
};

// ===== การ์ดสินค้า  mode: undefined = ทั่วไป, 'mine' = ประกาศของฉัน, 'preview' = พรีวิวในฟอร์ม =====
let refresh = () => {};
const toggleWish = (id) => { const w = getWish(); save('sm-wish', w.includes(id) ? w.filter(x => x !== id) : [...w, id]); };
const wishBtn = (p) => {
  const on = getWish().includes(p.id);
  const b = el('button', on ? '★ บันทึกแล้ว (กดเพื่อเอาออก)' : '☆ บันทึกไว้ดูภายหลัง', { type: 'button', class: 'btn-main' });
  b.addEventListener('click', () => { toggleWish(p.id); refresh(); });
  return b;
};
const card = (p, mode) => {
  const a = el('article', undefined, { class: 'product' });
  if (p.sold) a.style.opacity = '0.55';
  const h = el('h3');
  const t = mode === 'preview' ? document.createTextNode(p.title) : el('a', p.title, { href: 'product.html?id=' + encodeURIComponent(p.id) });
  if (p.sold) { const d = el('del'); d.append(t); h.append(d); } else { h.append(t); }
  a.append(photo(p), h);
  const b = badges(p);
  if (b) a.append(para(el('strong', b)));
  a.append(
    el('p', baht(p.price), { class: 'price' }),
    para(p.category + ' · สภาพ' + p.condition),
    para('นัดรับ: ' + p.meetPoint),
    para('ลงเมื่อ ', el('time', ago(p.postedAt), { datetime: p.postedAt }))
  );
  if (mode !== 'preview') a.append(wishBtn(p));
  if (mode === 'mine') {
    const sb = el('button', p.sold ? 'ยกเลิกป้ายขายแล้ว' : 'ทำเครื่องหมายขายแล้ว', { type: 'button', class: 'btn-main' });
    sb.addEventListener('click', () => { save('sm-mine', getMine().map(x => x.id === p.id ? { ...x, sold: !x.sold } : x)); refresh(); });
    const db = el('button', 'ลบประกาศ', { type: 'button', class: 'btn-main' });
    db.addEventListener('click', () => {
      if (confirm('ต้องการลบประกาศ "' + p.title + '" ใช่หรือไม่?')) {
        save('sm-mine', getMine().filter(x => x.id !== p.id));
        save('sm-wish', getWish().filter(x => x !== p.id));
        refresh();
      }
    });
    a.append(sb, db);
  }
  return a;
};
const fill = (box, items, mode, empty) => box.replaceChildren(...(items.length ? items.map(p => card(p, mode)) : [el('p', empty)]));

// อัปเดตเวลา "กี่นาทีที่แล้ว" แบบ real time ทุก 30 วินาที
setInterval(() => document.querySelectorAll('time').forEach(t => { t.textContent = ago(t.dateTime); }), 30000);

refresh = () => {
  const w = getWish();
  fill($('my-listings-grid'), getMine(), 'mine', 'ยังไม่มีประกาศของคุณ ลงประกาศได้ที่หน้า "ลงประกาศขาย"');
  fill($('wishlist-grid'), allItems().filter(p => w.includes(p.id)), undefined, 'ยังไม่มีรายการที่สนใจ');
};
refresh();
